```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TRALHA STUDIO — Painel</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#050505;
    color:white;
    min-height:100vh;
}

.login{
    width:90%;
    max-width:420px;
    margin:120px auto;
    padding:35px;
    background:#101010;
    border:1px solid #292929;
    border-radius:18px;
    box-shadow:0 20px 70px rgba(0,0,0,.5);
}

.login h1{
    text-align:center;
    color:#C8A43A;
    margin-bottom:10px;
    letter-spacing:3px;
}

.login p{
    text-align:center;
    color:#666;
    font-size:13px;
    margin-bottom:25px;
}

input,
textarea{
    width:100%;
    padding:14px;
    background:#080808;
    border:1px solid #303030;
    border-radius:9px;
    color:white;
    outline:none;
}

input:focus,
textarea:focus{
    border-color:#C8A43A;
}

button{
    width:100%;
    padding:14px;
    margin-top:12px;
    border:0;
    border-radius:9px;
    background:#C8A43A;
    color:#050505;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#E6CC6A;
}

.erro{
    color:#ff5555;
    text-align:center;
    margin-top:15px;
}

.painel{
    width:92%;
    max-width:1100px;
    margin:auto;
    padding:35px 0;
}

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:30px;
}

.header h1{
    color:#C8A43A;
    letter-spacing:2px;
}

.header p{
    color:#666;
    margin-top:7px;
    font-size:13px;
}

.logout{
    width:auto;
    padding:10px 20px;
    margin:0;
    background:#1c1c1c;
    color:white;
}

.logout:hover{
    background:#292929;
}

.conversa{
    background:#101010;
    border:1px solid #292929;
    border-radius:15px;
    overflow:hidden;
    margin-bottom:25px;
}

.conversa-topo{
    padding:16px;
    background:#181818;
    border-bottom:1px solid #292929;
    color:#C8A43A;
    font-size:12px;
    letter-spacing:1px;
}

.mensagens{
    padding:20px;
    max-height:400px;
    overflow-y:auto;
}

.msg{
    width:max-content;
    max-width:75%;
    padding:12px 15px;
    border-radius:12px;
    margin-bottom:12px;
    line-height:1.5;
    word-break:break-word;
}

.msg.visitante{
    background:#252525;
    margin-right:auto;
}

.msg.admin{
    background:#C8A43A;
    color:#050505;
    margin-left:auto;
}

.hora{
    display:block;
    font-size:9px;
    opacity:.6;
    margin-top:5px;
}

.resposta{
    padding:15px;
    border-top:1px solid #292929;
}

.resposta textarea{
    height:80px;
    resize:none;
}

.sem{
    text-align:center;
    color:#666;
    padding:100px 20px;
}

.status{
    display:inline-flex;
    align-items:center;
    gap:8px;
    color:#777;
    font-size:12px;
}

.dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#48d66b;
    box-shadow:0 0 10px #48d66b;
}

@media(max-width:600px){

    .painel{
        width:94%;
    }

    .header{
        flex-direction:column;
        gap:18px;
        align-items:flex-start;
    }

    .logout{
        width:100%;
    }

    .msg{
        max-width:90%;
    }
}
</style>
</head>

<body>

{% if login %}

<div class="login">

    <h1>TRALHA STUDIO</h1>

    <p>
        Painel de atendimento
    </p>

    <form method="POST">

        <input
            type="password"
            name="senha"
            placeholder="Digite a senha"
            required
        >

        <button type="submit">
            ENTRAR
        </button>

    </form>

    {% if erro %}
        <div class="erro">
            {{ erro }}
        </div>
    {% endif %}

</div>

{% else %}

<div class="painel">

    <div class="header">

        <div>
            <h1>💬 PAINEL DE CHAT</h1>

            <p>
                Atendimento dos visitantes da TRALHA STUDIO
            </p>

            <div class="status">
                <span class="dot"></span>
                Sistema online
            </div>
        </div>

        <button
            class="logout"
            onclick="location.href='/admin/logout'"
        >
            SAIR
        </button>

    </div>

    <div id="conversas">

        <div class="sem">
            Carregando conversas...
        </div>

    </div>

</div>

<script>

function escapeHTML(text){

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


async function carregar(){

    try{

        const resposta =
            await fetch("/admin/mensagens");

        if(!resposta.ok){
            return;
        }

        const mensagens =
            await resposta.json();

        const grupos = {};

        mensagens.forEach(function(msg){

            if(!grupos[msg.visitante_id]){
                grupos[msg.visitante_id] = [];
            }

            grupos[msg.visitante_id].push(msg);

        });

        const container =
            document.getElementById("conversas");

        const ids =
            Object.keys(grupos);

        if(ids.length === 0){

            container.innerHTML = `
                <div class="sem">
                    Nenhum visitante enviou mensagem ainda.
                </div>
            `;

            return;
        }

        let html = "";

        ids.forEach(function(id){

            html += `
                <div class="conversa">

                    <div class="conversa-topo">
                        👤 VISITANTE —
                        ${id.substring(0,8)}
                    </div>

                    <div class="mensagens">
            `;

            grupos[id].forEach(function(msg){

                html += `
                    <div class="msg ${msg.remetente}">

                        ${escapeHTML(msg.mensagem)}

                        <span class="hora">
                            ${msg.data}
                        </span>

                    </div>
                `;

            });

            html += `
                    </div>

                    <div class="resposta">

                        <textarea
                            id="resposta-${id}"
                            placeholder="Digite sua resposta..."
                        ></textarea>

                        <button
                            onclick="responder('${id}')"
                        >
                            ENVIAR RESPOSTA
                        </button>

                    </div>

                </div>
            `;

        });

        container.innerHTML = html;

    }catch(erro){

        console.log(erro);

    }
}


async function responder(id){

    const campo =
        document.getElementById(
            "resposta-" + id
        );

    const mensagem =
        campo.value.trim();

    if(!mensagem){

        alert("Digite uma resposta!");

        return;
    }

    try{

        const resposta =
            await fetch(
                "/admin/responder",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        visitante_id:id,
                        mensagem:mensagem
                    })
                }
            );

        if(!resposta.ok){

            alert("Erro ao enviar resposta.");

            return;
        }

        campo.value = "";

        carregar();

    }catch(erro){

        console.log(erro);

        alert("Erro de conexão.");

    }
}


carregar();

setInterval(
    carregar,
    2000
);

</script>

{% endif %}

</body>
</html>
```
